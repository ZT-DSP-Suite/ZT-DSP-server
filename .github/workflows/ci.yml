#
# 每个架构都要**真的编出对应架构的二进制**，并用 readelf 断言。
#
# 这里用标准 ubuntu-24.04 runner + 交叉链接器，而不是 arm64 原生 runner：
# `ubuntu-24.04-arm` 在本组织不可用，会让整个 workflow 以 startup_failure、0 个 job 结束。
# 交叉编译同样能编出真正的 aarch64 ELF，readelf 断言保证它不是 x86_64 冒充的。
#
# 刻意不用 pull_request_target：那会让 fork 的 PR 拿到本仓 secrets。
# 本工作流不引用任何 secrets。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            machine: X86-64
            cross: false
          - target: aarch64-unknown-linux-gnu
            machine: AArch64
            cross: true

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: ${{ matrix.target }}

      - name: install the cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu

      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked

      - name: release build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: assert the binary really is ${{ matrix.machine }}
        run: |
          BIN=target/${{ matrix.target }}/release/zt-dsp-server
          test -x "$BIN" || { echo "missing $BIN"; exit 1; }
          ls -l "$BIN"
          readelf -h "$BIN" | grep Machine
          readelf -h "$BIN" | grep -q "${{ matrix.machine }}" || {
            echo "expected ${{ matrix.machine }}, got:"
            readelf -h "$BIN" | grep Machine
            exit 1
          }

      - name: version contract
        run: |
          OUT=$(target/${{ matrix.target }}/release/zt-dsp-server --version)
          echo "$OUT"
          echo "$OUT" | grep -q 'ZT-DSP_SV-1.0.0'
